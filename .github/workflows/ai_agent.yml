name: Copilot Skill Check

on:
  workflow_dispatch:   # manual trigger
  push:
    paths:
      - "SKILL.md"     # only run when SKILL.md changes
permissions:
  contents: read
  copilot-requests: write  # Crucial for Copilot API access
  
jobs:
  copilot-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Copilot CLI
        run: |
          npm install -g @github/copilot

      - name: Run Copilot Agent Task
        run: |
          copilot --yolo -p "Review the changes in the latest commit and check for potential security flaws. Provide remediation step by output to Workflow Summary Page. Raise PR and let user review"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
